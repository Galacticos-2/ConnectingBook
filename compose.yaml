# Optional local-only demo. The primary workflow is scripts/Start-Local.ps1 without Docker.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Provide SQL_SA_PASSWORD through environment}
      SQLCMDPASSWORD: ${SQL_SA_PASSWORD:?Provide SQL_SA_PASSWORD through environment}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  app:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command: ["dotnet Project-Web-ConnectingBook.Server.dll --seed-demo && exec dotnet Project-Web-ConnectingBook.Server.dll"]
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: ${COMPOSE_SQL_CONNECTION:?Provide a connection to a ConnectingBook_Demo_ database on sql}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Provide JWT_SIGNING_KEY}
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/localhost.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${LOCAL_HTTPS_PASSWORD:?Provide LOCAL_HTTPS_PASSWORD}
      Client__Origin: https://localhost:7244
      Storage__Provider: Local
      Storage__LocalPath: /app/.local/media
      DEMO_EMAIL: ${DEMO_EMAIL:?Provide DEMO_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Provide DEMO_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Provide ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Provide ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:7244:8443"
    volumes:
      - ./.local/https:/https:ro
      - media-data:/app/.local
  minio:
    profiles: [minio]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
volumes:
  sql-data:
  media-data:
  minio-data:
